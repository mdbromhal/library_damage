<!DOCTYPE html>
<html>
<head>
    <title>Book Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .book {
            border: 1px solid #ddd;
            margin: 10px;
            padding: 10px;
            width: 250px;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
        }
        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>Book Gallery</h1>
    <div class="gallery">
        {% for book in book_data %}
        <div class="book">
            <h2>{{ book.title }}</h2>
            <h4>by {{ book.author }}</h4>
            <img src="{{ book.cover_url }}" alt="Cover">
            <p>{{ book.description }}</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
